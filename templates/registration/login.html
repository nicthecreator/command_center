{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Central Web</title>
    <!-- Tailwind CSS -->
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen font-sans antialiased">

<div class="bg-white p-8 rounded-lg shadow-lg border border-gray-200 w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-gray-900">Central Web</h1>
        <p class="text-gray-500 mt-2 text-sm">Acesse seu painel administrativo</p>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        {% if form.non_field_errors %}
        <div class="bg-red-50 text-red-600 p-3 rounded text-sm">
            {{ form.non_field_errors }}
        </div>
        {% endif %}

        <div>
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-gray-700">Usuário</label>
            <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" required
                   class="mt-1 w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            <p class="text-xs text-red-500 mt-1">{{ form.username.errors }}</p>
        </div>

        <div>
            <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-gray-700">Senha</label>
            <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" required
                   class="mt-1 w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            <p class="text-xs text-red-500 mt-1">{{ form.password.errors }}</p>
        </div>

        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
            Entrar
        </button>
        
        <input type="hidden" name="next" value="{{ next|default:'' }}">
    </form>
</div>

</body>
</html>
